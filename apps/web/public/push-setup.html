<!doctype html>
<html>
<head>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SenseLayer Push Setup</title>
</head>
<body style="font-family:system-ui;padding:30px">
  <h1>SenseLayer Push</h1>
  <button id="subscribe" style="font-size:20px;padding:16px">
    Enable Watch notifications
  </button>
  <p id="status"></p>

<script>
function urlBase64ToUint8Array(base64String) {
  const padding = '='.repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding)
    .replace(/-/g, '+')
    .replace(/_/g, '/');

  const rawData = atob(base64);
  return Uint8Array.from([...rawData].map(c => c.charCodeAt(0)));
}

document.getElementById('subscribe').onclick = async () => {
  const status = document.getElementById('status');

  try {
    status.textContent = 'Setting up...';

    const permission = await Notification.requestPermission();

    if (permission !== 'granted') {
      status.textContent = 'Permission: ' + permission;
      return;
    }

    status.textContent = 'Registering service worker...';

    await navigator.serviceWorker.register('/sw.js');
    const registration = await navigator.serviceWorker.ready;

    status.textContent = 'Creating push subscription...';

    const keyResponse = await fetch('/api/push/vapid-public-key');
    const { publicKey } = await keyResponse.json();

    const oldSubscription =
      await registration.pushManager.getSubscription();

    if (oldSubscription) {
      await oldSubscription.unsubscribe();
    }

    const subscription =
      await registration.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: urlBase64ToUint8Array(publicKey)
      });

    const response = await fetch('/api/push/subscribe', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(subscription)
    });

    if (!response.ok) throw new Error('Server rejected subscription');

    status.textContent = '✅ Push READY — lock your iPhone and test.';
  } catch (error) {
    status.textContent = '❌ ' + error.message;
    console.error(error);
  }
};
</script>
</body>
</html>
